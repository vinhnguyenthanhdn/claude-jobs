name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `claude-jobs doctor`
      description: Current versions omit account email. If an older install shows one, redact it before submitting.
      render: shell
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From `claude-jobs logs <name>`. Redact anything sensitive — logs can contain whatever the agent read.
      render: shell
  - type: input
    id: env
    attributes:
      label: OS, Node version, scheduler
      placeholder: macOS 15.6, Node 22.11, launchd
    validations:
      required: true
