name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  scope-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Removed public exports must be named in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/scope-guard.mjs "$BASE_SHA" "$HEAD_SHA"

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # Catches the classic release bug: a file that works locally but was
      # never listed in package.json "files".
      - run: npm pack --dry-run

  # The README claims "systemd user timers on Linux". Every other leg only
  # proves the Node code runs; nothing here had ever handed a unit to systemd
  # and read it back, so the claim had no evidence behind it. This job registers
  # a real timer on the runner's own user manager, asks systemd about it, and
  # removes it again.
  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # If the runner image ever stops giving the job a user manager, every
      # assertion below would pass vacuously. Fail here instead, loudly.
      - name: The runner must have a usable user systemd session
        run: |
          systemctl --user status >/dev/null
          echo "user manager: $(systemctl --user show -p Version --value)"

      - name: Register a timer with systemd, read it back, then remove it
        env:
          JOB: ci-systemd-gate
        run: |
          set -euo pipefail
          npm install -g .

          claude-jobs init "$JOB" \
            --task "syntax placeholder; this job is never run" \
            --at 04:00 --jitter 0 --scheduler systemd --workdir "$PWD"

          # Negative evidence: the grep below must be able to find nothing.
          # Without this, a permanently-matching pattern would pass forever.
          if systemctl --user list-timers --all --no-legend | grep -q "claude-jobs-$JOB.timer"; then
            echo "::error::timer was already registered before install ran"
            exit 1
          fi

          claude-jobs install "$JOB"

          # Ask systemd, not the filesystem. `init` writes the unit file, so a
          # file existing proves only that a file was written.
          systemctl --user list-timers --all --no-legend | grep "claude-jobs-$JOB.timer"
          test "$(systemctl --user is-enabled "claude-jobs-$JOB.timer")" = enabled
          test "$(systemctl --user is-active "claude-jobs-$JOB.timer")" = active
          test "$(systemctl --user show -p Persistent --value "claude-jobs-$JOB.timer")" = yes
          systemctl --user show -p TimersCalendar --value "claude-jobs-$JOB.timer" \
            | grep -q 'OnCalendar=\*-\*-\* 04:00:00'

          claude-jobs uninstall "$JOB"

          if systemctl --user list-timers --all --no-legend | grep -q "claude-jobs-$JOB.timer"; then
            echo "::error::timer survived uninstall"
            exit 1
          fi
          test ! -e "$HOME/.config/systemd/user/claude-jobs-$JOB.timer"
          test ! -e "$HOME/.config/systemd/user/claude-jobs-$JOB.service"

  # The README also claims cron "where either is missing". cron was covered only
  # at the pure-function level — `crontabHas`/`crontabWithout` over strings — so
  # nothing had ever handed a line to `crontab` and read it back. This job does,
  # on the same runner, and it starts from an empty crontab so the readback
  # cannot be satisfied by something that was already there.
  cron:
    runs-on: ubuntu-latest
    env:
      JOB: ci-cron-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: The runner must have a usable crontab
        run: |
          printf '' | crontab -
          crontab -l 2>/dev/null || true

      - name: Hand a line to crontab, read it back, then remove it
        run: |
          set -euo pipefail
          npm install -g .

          claude-jobs init "$JOB" \
            --task "syntax placeholder; this job is never run" \
            --at 04:07 --jitter 0 --scheduler cron --workdir "$PWD"

          # Negative evidence: the readback below must be able to find nothing.
          if crontab -l 2>/dev/null | grep -q "claude-jobs:$JOB"; then
            echo "::error::the marker was in the crontab before install ran"
            exit 1
          fi

          claude-jobs install "$JOB"

          # Ask cron's own store, not a file this tool wrote.
          crontab -l > installed.txt
          echo "--- crontab after install:"
          cat installed.txt
          grep -q "# claude-jobs:$JOB\$" installed.txt
          # The schedule is the claim: --at 04:07 must survive as "7 4 * * *".
          grep -qE "^7 4 \* \* \* " installed.txt
          grep -q "claude-jobs/jobs/$JOB/run.sh" installed.txt

          claude-jobs uninstall "$JOB"
          if crontab -l 2>/dev/null | grep -q "claude-jobs:$JOB"; then
            echo "::error::the line survived uninstall"
            exit 1
          fi

  # The README also promises launchd on macOS, but a plist on disk proves only
  # that a file was written. This job asks the user's GUI launchd domain to
  # accept the job, checks the registered path and calendar, then removes it.
  launchd:
    runs-on: macos-latest
    env:
      JOB: ci-launchd-gate
      LABEL: com.claude-jobs.ci-launchd-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: The runner must have a usable GUI launchd domain
        run: |
          set -euo pipefail
          launchctl print "gui/$(id -u)" >/dev/null

      - name: Register a job with launchd, read it back, then remove it
        run: |
          set -euo pipefail
          npm install -g .

          claude-jobs init "$JOB" \
            --task "syntax placeholder; this job is never run" \
            --at 04:11 --jitter 0 --scheduler launchd --workdir "$PWD"

          # Negative evidence: the label must not already be loaded. Otherwise
          # a stale job could satisfy every assertion after install is removed.
          if launchctl print "gui/$(id -u)/$LABEL" >/dev/null 2>&1; then
            echo "::error::launchd label was already registered before install ran"
            exit 1
          fi

          claude-jobs install "$JOB"

          # Ask launchd, not the plist on disk. The registered state must carry
          # both the generated runner and the requested calendar interval.
          launchd_state="$(launchctl print "gui/$(id -u)/$LABEL")"
          printf '%s\n' "$launchd_state"
          grep -Fq "$HOME/.claude-jobs/jobs/$JOB/run.sh" <<<"$launchd_state"
          grep -Fq 'Hour = 4' <<<"$launchd_state"
          grep -Fq 'Minute = 11' <<<"$launchd_state"

          claude-jobs uninstall "$JOB"

          if launchctl print "gui/$(id -u)/$LABEL" >/dev/null 2>&1; then
            echo "::error::launchd label survived uninstall"
            exit 1
          fi
          test ! -e "$HOME/Library/LaunchAgents/$LABEL.plist"
