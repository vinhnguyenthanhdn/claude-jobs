name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  scope-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Removed public exports must be named in the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/scope-guard.mjs "$BASE_SHA" "$HEAD_SHA"

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # Catches the classic release bug: a file that works locally but was
      # never listed in package.json "files".
      - run: npm pack --dry-run

  systemd-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Does this runner have a usable user systemd session?
        run: |
          echo "whoami=$(whoami) uid=$(id -u)"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-<unset>}"
          echo "pid1=$(ps -p 1 -o comm=)"
          loginctl show-user "$(whoami)" 2>&1 | head -5 || true
          echo "--- systemctl --user status"
          systemctl --user status >/dev/null 2>&1 && echo "USER_SESSION=yes" || echo "USER_SESSION=no (exit $?)"
          echo "--- after enable-linger"
          sudo loginctl enable-linger "$(whoami)" 2>&1 || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user status >/dev/null 2>&1 && echo "USER_SESSION_LINGER=yes" || echo "USER_SESSION_LINGER=no (exit $?)"
          systemctl --user list-timers --all 2>&1 | head -5 || true
